<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7FB5F3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Mickey 工作台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 侧边栏：固定排序 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">M</div>
        <div class="brand-name">Mickey</div>
        <div class="brand-sub">专属工作台</div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-target="home"><span class="ni">🏠</span><span>首页</span></button>
        <button class="nav-item" data-target="plan"><span class="ni">📋</span><span>每日计划</span></button>
        <button class="nav-item" data-target="review"><span class="ni">🔄</span><span>周复盘</span></button>
        <button class="nav-item" data-target="learn"><span class="ni">📚</span><span>学习复盘</span></button>
        <button class="nav-item" data-target="sports"><span class="ni">🏃</span><span>运动</span></button>
        <button class="nav-item" data-target="ledger"><span class="ni">💰</span><span>记账本</span></button>
        <button class="nav-item" data-target="english"><span class="ni">🔤</span><span>每日英语</span></button>
        <button class="nav-item" data-target="mood"><span class="ni">💗</span><span>今日心情</span></button>
        <button class="nav-item" data-target="inspiration"><span class="ni">💡</span><span>选题灵感</span></button>
        <button class="nav-item" data-target="tailor"><span class="ni">✂️</span><span>裁缝日记</span></button>
      </nav>
      <div class="sidebar-foot">数据本地保存 · 可加桌面</div>
    </aside>

    <!-- 主内容 -->
    <main class="content">
      <header class="topbar">
        <div class="topbar-title" id="pageTitle">每日计划</div>
        <div class="topbar-date" id="topDate"></div>
      </header>

      <!-- 0. 首页 -->
      <section class="page active" id="home">
        <div id="homeBody"></div>
      </section>

      <!-- 1. 每日计划 -->
      <section class="page" id="plan">
        <div class="page-head">
          <h2>每日计划</h2>
          <span class="muted" id="planDate"></span>
        </div>
        <div class="progress">
          <div class="progress-bar"><div class="progress-fill" id="planProgressFill"></div></div>
          <span id="planProgressText"></span>
        </div>
        <div class="schedule-summary" id="scheduleSummary"></div>
        <div class="task-list" id="taskList"></div>
        <div class="add-row">
          <input id="taskInput" type="text" placeholder="添加新任务，回车确认…" maxlength="60" />
          <input id="taskDue" type="date" class="due-input" title="截止日期（可选）" />
          <button id="taskAdd" class="btn-primary">添加</button>
        </div>
      </section>

      <!-- 2. 周复盘 -->
      <section class="page" id="review">
        <div class="page-head">
          <h2>周复盘</h2>
          <span class="muted" id="reviewRange"></span>
        </div>
        <div class="week-nav">
          <button id="weekPrev" class="btn-ghost">← 上一周</button>
          <select id="weekSelect" class="week-select"></select>
          <button id="weekNext" class="btn-ghost">下一周 →</button>
          <button id="weekToday" class="btn-ghost">本周</button>
        </div>
        <p class="muted" id="reviewHint"></p>
        <div class="review-grid">
          <div class="review-block">
            <label>✅ 完成了什么</label>
            <textarea id="rvCompleted" placeholder="本周做成的事…"></textarea>
          </div>
          <div class="review-block">
            <label>⚠️ 问题 & 阻碍</label>
            <textarea id="rvProblems" placeholder="卡住的点、困难…"></textarea>
          </div>
          <div class="review-block">
            <label>🚀 下周改进</label>
            <textarea id="rvImprovements" placeholder="下周的行动计划…"></textarea>
          </div>
          <div class="review-block">
            <label>🌟 高光时刻</label>
            <textarea id="rvHighlights" placeholder="值得记录的亮点…"></textarea>
          </div>
        </div>

        <div class="page-head" style="margin-top:20px"><h3>💭 心里想法</h3><span class="muted">记录这周真实的情绪与想法</span></div>
        <textarea id="rvThoughts" placeholder="这周的真实感受、情绪波动、想说的话…"></textarea>

        <div class="analysis-block" id="reviewAnalysis"></div>
        <div class="ai-row">
          <button class="btn-ghost" id="genSuggestions">🔍 生成本周效率分析 & 建议</button>
          <button class="btn-ghost" id="aiReview" style="display:none">✨ AI 综合建议</button>
        </div>
      </section>

      <!-- 学习复盘 -->
      <section class="page" id="learn">
        <div class="page-head">
          <h2>学习复盘</h2>
          <span class="muted">读书 · 拆解观点 · 应用洞察</span>
        </div>
        <div class="learn-tools">
          <button class="btn-primary" id="addBook">➕ 添加书籍</button>
          <button class="btn-ghost" id="aiCfgBtn">⚙️ AI 分析设置</button>
        </div>
        <div class="analysis-block" id="learnInsight"></div>
        <div id="recWrap"></div>
        <div class="book-list" id="bookList"></div>
      </section>

      <!-- 3. 选题每日灵感 -->
      <section class="page" id="inspiration">
        <div class="page-head">
          <h2>选题每日灵感</h2>
          <span class="muted">随手记录灵感碎片</span>
        </div>
        <div class="ref-links">
          <a class="ref-link" href="https://www.douyin.com" target="_blank" rel="noopener">🎵 抖音灵感</a>
          <a class="ref-link" href="https://www.xiaohongshu.com" target="_blank" rel="noopener">📕 小红书灵感</a>
        </div>
        <div class="card hot-card">
          <div class="hot-head">
            <h3 style="margin:0">🔥 热门话题推荐</h3>
            <button class="btn-ghost" id="hotRefresh">换一批</button>
          </div>
          <p class="muted" style="margin:4px 0 10px">灵感枯竭时看看当下高热度的选题方向，点击「存为灵感」即可收纳到下方。</p>
          <div class="hot-list" id="hotList"></div>
        </div>
        <div class="add-row">
          <input id="ideaInput" type="text" placeholder="今天想到什么选题？回车记录…" maxlength="120" />
          <button id="ideaAdd" class="btn-primary">记录</button>
        </div>
        <div class="item-list" id="ideaList"></div>
      </section>

      <!-- 4. 裁缝日记 -->
      <section class="page" id="tailor">
        <div class="page-head">
          <h2>裁缝日记</h2>
          <span class="muted">物料 · 样品 · 摆拍 · 渠道 · 订单</span>
        </div>
        <div class="subtabs" id="tailorTabs"></div>
        <div class="tailor-tools">
          <button class="btn-ghost" id="tailorExport">⬇️ 导出备份</button>
          <button class="btn-ghost" id="tailorImport">⬆️ 导入备份</button>
          <input type="file" id="tailorImportFile" accept="application/json,.json" style="display:none">
        </div>
        <div class="warn-banner" id="stockBanner" style="display:none"></div>
        <div id="tailorBody"></div>
      </section>

      <!-- 5. 记账本 -->
      <section class="page" id="ledger">
        <div class="page-head">
          <h2>记账本</h2>
          <span class="muted">预算 · 净资产 · 收支流水</span>
        </div>
        <div id="ledgerBody"></div>
      </section>

      <!-- 6. 运动 -->
      <section class="page" id="sports">
        <div class="page-head">
          <h2>运动</h2>
          <span class="muted">计划 · 打卡 · 饮食 · 复盘</span>
        </div>
        <div class="subtabs" id="sportTabs"></div>
        <div id="sportBody"></div>
      </section>
      <!-- 7. 每日英语 -->
      <section class="page" id="english">
        <div class="page-head">
          <h2>每日英语</h2>
          <span class="muted" id="engStreak"></span>
        </div>
        <div class="learn-tools">
          <button class="btn-ghost" id="engThemeBtn">🎯 切换主题</button>
          <button class="btn-ghost" id="engAllRead">🔊 朗读全部</button>
        </div>
        <div id="engBody"></div>
      </section>

      <!-- 8. 今日心情 -->
      <section class="page" id="mood">
        <div class="page-head">
          <h2>今日心情</h2>
          <span class="muted" id="moodSign"></span>
        </div>
        <div id="moodBody"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
